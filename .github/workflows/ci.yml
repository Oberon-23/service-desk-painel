name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  navegador:
    name: Testes no navegador e acessibilidade
    runs-on: ubuntu-latest
    # imagem oficial do Playwright: o navegador e as dependências já vêm instalados (sem apt no CI)
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-playwright
          path: playwright-report
          retention-days: 7
